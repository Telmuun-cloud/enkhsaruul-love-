<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Enkhsaruul 💗</title>
<style>
:root{--pink:#ff5d93;--deep:#7e2450;--cream:#fff8fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--deep);background:radial-gradient(circle at top,#ffe0ec,#fff8fb 58%,#fce8f1);display:grid;place-items:center;padding:20px;overflow-x:hidden}
.card{width:min(100%,430px);background:#ffffffd9;border:1px solid #ffffff;box-shadow:0 18px 60px #bd527522;border-radius:28px;padding:28px 23px;text-align:center;position:relative;backdrop-filter:blur(8px)}
.heart{font-size:45px;animation:pulse 1.4s infinite}
h1{font-size:29px;margin:10px 0 8px;letter-spacing:-.5px}
p{line-height:1.55;color:#8d4b69}
.sub{font-size:14px;margin:0 0 22px}
button{font:inherit;border:0;border-radius:15px;padding:13px 17px;background:var(--pink);color:white;font-weight:700;cursor:pointer;box-shadow:0 7px 16px #ff5d9333;transition:transform .15s}
button:active{transform:scale(.97)}
button.secondary{background:#ffe5ef;color:var(--deep);box-shadow:none}
.choices{display:grid;gap:10px;margin-top:18px}
.choices button{background:#fff0f6;color:var(--deep);border:1px solid #ffd2e2;box-shadow:none;text-align:left}
.choices button:hover{background:#ffe0ec}
.progress{height:6px;border-radius:99px;background:#ffe5ef;margin:0 0 22px;overflow:hidden}
.bar{height:100%;width:0;background:var(--pink);transition:width .3s}
.small{font-size:12px;opacity:.75;margin-top:20px}
.result{font-size:18px;font-weight:700;margin:18px 0}
.float{position:fixed;bottom:-30px;animation:rise 7s linear infinite;opacity:.5;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<div class="card" id="app">
  <div class="heart">💌</div>
  <h1>Энхсаруулд зориулсан тест</h1>
  <p>Жаахан хөөрхөн асуулттай, нууцхан мессежтэй жижигхэн булан шүү 💗</p>
  <p class="sub">Бэлэн үү? Хариултуудаа сонгоод үзээрэй.</p>
  <button id="startBtn">Эхлэх 💞</button>
  <div class="small">made with 💗 just for Enkhsaruul</div>
</div>
<script>
const questions=[
 {q:"Чөлөөт цагаараа юу сонсох дуртай вэ?",a:["Ling Shot 🎧","Уянгын дуу 🌙","Янз бүрийн дуу 🎶"],m:["Тэгвэл playlist-ээ хамт хуваалцаарай 🎧","Зөөлөн дуунууд чамд яг тохирох байх 🌙","Хөгжмийн taste чинь сонирхолтой юм байна 🎶"]},
 {q:"Хэн нэгэн чамайг инээлгэвэл…",a:["Би ч бас инээнэ 😊","Ичих байх 🙈","Дахиад инээлгэхийг хүснэ 😆"],m:["Инээмсэглэл чинь хамгийн гоё хариулт 😊","Ичимхий хариулт ч бас хөөрхөн 🙈","Тэгвэл тэр хүн азтай юм байна 😆"]},
 {q:"Чамд ямар мессеж хамгийн гоё вэ?",a:["Өдрийг чинь гоё өнгөрүүлээрэй 💗","Чамайг саналаа 🫶","Хамт хөгжим сонсох уу? 🎧"],m:["Жижигхэн халамж хамгийн гоё 💗","Үнэн сэтгэлийн үг шүү 🫶","Хөгжмөөр эхэлсэн яриа гоё байдаг 🎧"]}
];
let i=0;
document.addEventListener('click', function(e){
 const btn=e.target.closest('button'); if(!btn) return;
 if(btn.id==='startBtn' || btn.dataset.action==='restart'){ start(); return; }
 if(btn.dataset.answer!==undefined){ answer(Number(btn.dataset.answer)); return; }
 if(btn.dataset.action==='next'){ i++; showQ(); }
});
function start(){i=0;showQ()}
function showQ(){
 const q=questions[i];
 document.getElementById('app').innerHTML=`<div class="progress"><div class="bar" style="width:${(i/questions.length)*100}%"></div></div><div class="heart">💗</div><p class="sub">Асуулт ${i+1} / ${questions.length}</p><h1>${q.q}</h1><div class="choices">${q.a.map((a,j)=>`<button data-answer="${j}">${a}</button>`).join('')}</div><div class="small">Яг зөв, буруу хариулт байхгүй шүү ✨</div>`;
}
function answer(j){
 const q=questions[i], msg=q.m[j];
 if(i<questions.length-1){document.getElementById('app').innerHTML=`<div class="heart">🥹💗</div><h1>Хөөрхөн хариулт!</h1><p>${msg}</p><button data-action="next">Дараагийнх →</button>`}
 else{document.getElementById('app').innerHTML=`<div class="heart">💌</div><h1>Энхсаруул аа…</h1><p>${msg}</p><p class="result">Чи өөрийнхөөрөө л гоё хүн шүү. 💗</p><p>Энэ жижигхэн тестийг чамд зориулж хийлээ. Өнөөдөр чинь инээмсэглэлээр дүүрэн байг ✨</p><button data-action="restart">Дахин тоглох ↻</button>`;hearts()}
}
function hearts(){for(let n=0;n<12;n++){let e=document.createElement('div');e.className='float';e.textContent=['💗','💕','✨','💖'][n%4];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*2+'s';e.style.fontSize=(16+Math.random()*18)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),8000)}}
</script>
</body>
</html>
